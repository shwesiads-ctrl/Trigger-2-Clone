name: Build B Trigger

on:
  push:
    # Documentation-only pushes do not need a build (macOS minutes are billed at 10x on a private repo).
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            extra: ""
          - os: macos-latest
            name: macOS
            extra: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.extra }}

      - name: Build the plugin (VST3, AU on macOS, and the standalone)
        run: cmake --build build --config Release --parallel

      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          find build/BTrigger_artefacts -maxdepth 4 \( -name "*.vst3" -o -name "*.component" -o -name "*.app" -o -name "*.exe" \) -print
          find build/BTrigger_artefacts -maxdepth 4 \( -name "*.vst3" -o -name "*.component" -o -name "*.app" -o -name "*.exe" \) -exec cp -R {} dist/ \;
          ls -la dist

      - name: Zip (Windows)
        if: matrix.name == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath B-Trigger-Windows.zip

      # macOS will not load an unsigned binary on Apple Silicon, so sign the bundles ad-hoc.
      # This is not an Apple Developer signature, so the download still has to be un-quarantined (see the README).
      - name: Sign ad-hoc (macOS)
        if: matrix.name == 'macOS'
        run: |
          for b in dist/*.vst3 dist/*.component dist/*.app; do
            [ -e "$b" ] || continue
            codesign --force --deep --sign - --timestamp=none "$b"
            codesign --verify --verbose "$b" || true
          done

      # Logic only loads an Audio Unit that passes Apple's own validator, so run it here.
      - name: Validate the Audio Unit (macOS)
        if: matrix.name == 'macOS'
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "dist/B Trigger.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 5
          auval -a | grep -i "btrg\|B Trigger" || echo "not listed yet"
          auval -v aufx Btrg Bart

      - name: Zip (macOS)
        if: matrix.name == 'macOS'
        run: cd dist && ditto -c -k --sequesterRsrc . ../B-Trigger-macOS.zip

      # One rolling release per platform, so the download link never changes and old builds do not pile up.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.name }}-latest
          name: B Trigger for ${{ matrix.name }}
          body: |
            Latest build of B Trigger for ${{ matrix.name }} (build ${{ github.run_number }}, commit ${{ github.sha }}).

            Unzip and follow the install steps in the [README](https://github.com/shwesiads-ctrl/Trigger-2-Clone#install).
            On macOS, remove the quarantine flag afterwards or macOS will say the plugin is damaged.
          files: B-Trigger-${{ matrix.name }}.zip

      - name: Upload artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: B-Trigger-${{ matrix.name }}
          path: B-Trigger-${{ matrix.name }}.zip
